name: Build and Deploy to ECR

on:
  push:
    branches: [ "fix/76-apitest" ]
  workflow_dispatch: 
  
jobs:
  build-and-push-ecr:
    name: Build and Push Docker image to ECR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Restore secret files (.env, gcp_key.json)
      run: 
        echo "${{ secrets.ENV_FILE }}" > .env
        echo '${{ secrets.GCP_KEY_JSON }}' > gcp_key.json
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: latest
      run: |
        docker build -f src/Dockerfile -t $ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    name: Deploy to EC2 via SSM
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
  
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
  
    - name: Deploy via SSM
      run: |
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy chatbot via SSM" \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ secrets.AWS_REGION }}" \
          --parameters 'commands=[
            "if ! command -v aws &> /dev/null; then sudo apt update && sudo apt install -y awscli; fi",
            "export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}",
            "export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}",
            "export AWS_REGION=${{ secrets.AWS_REGION }}",
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $(echo ${{ secrets.ECR_REPOSITORY }} | cut -d'/' -f1)",
            "CONTAINER_ID=$(docker ps -q --filter 'publish=8000')",
            "if [ -n \\"$CONTAINER_ID\\" ]; then docker stop $CONTAINER_ID || true; docker rm $CONTAINER_ID || true; fi",
            "docker stop chatbot-api || true",
            "docker rm chatbot-api || true",
            "docker stop ai || true",
            "docker rm ai || true",
            "docker pull ${{ secrets.ECR_REPOSITORY }}:latest",
            "docker run -d -p 8000:8000 --name chatbot-api ${{ secrets.ECR_REPOSITORY }}:latest"
          ]' \
          --output text
