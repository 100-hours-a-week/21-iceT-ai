name: Build and Deploy to ECR

on:
  push:
    branches: [ "feat/2-chatbot" ]

jobs:
  build-and-push-ecr:
    name: Build and Push Docker image to ECR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Restore secret files (.env, gcp_key.json)
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env
        echo '${{ secrets.GCP_KEY_JSON }}' > gcp_key.json
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: latest
      run: |
        docker build -f src/chatbot/Dockerfile -t $ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push-ecr
    runs-on: ubuntu-latest

    steps:
    - name: Add SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: SSH and Deploy
      run: |
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin $(echo ${{ secrets.ECR_REPOSITORY }} | cut -d'/' -f1)

          docker stop chatbot-api || true
          docker rm chatbot-api || true

          docker pull ${{ secrets.ECR_REPOSITORY }}:latest

          docker run -d -p 8000:8000 --name chatbot-api \
            -e GOOGLE_APPLICATION_CREDENTIALS=/app/gcp_key.json \
            ${{ secrets.ECR_REPOSITORY }}:latest
        EOF
