name: Deploy via SSM

on:
  push:
    branches:
      - fix/76-apitest
  workflow_dispatch:

jobs:
  deploy-to-ec2:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy via SSM
      run: |
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy chatbot via SSM" \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --region "${{ secrets.AWS_REGION }}" \
          --parameters 'commands=[
            "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $(echo ${{ secrets.ECR_REPOSITORY }} | cut -d'/' -f1)",
            "docker stop chatbot-api || true",
            "docker rm chatbot-api || true",
            "docker pull ${{ secrets.ECR_REPOSITORY }}:latest",
            "docker run -d -p 8000:8000 --name chatbot-api ${{ secrets.ECR_REPOSITORY }}:latest"
          ]' \
          --output text
